syntax = "proto3";

package GRPC_USER_SERVICE;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc createUser (CreateUserRequest) returns (UserIdResponse);
  rpc getUserAuth (UserAuthRequest) returns (UserAuthResponse);
  rpc getUser (GetUserAdminRequest) returns (UserAdminDetailGrpcDto);
  rpc getUsers (GetUsersAdminRequest) returns (UsersResponse);

  rpc getAddresses (GetAddressesRequest) returns (AddressesResponse);
  rpc createAddress (CreateAddressRequest) returns (AddressResponse);
  rpc updateAddress (UpdateAddressRequest) returns (AddressResponse);
  rpc deleteAddress (AddressActionRequest) returns (AddressIdResponse);
  rpc setDefaultAddress (AddressActionRequest) returns (AddressResponse);

  rpc getWishlist (GetWishlistRequest) returns (WishlistResponse);
  rpc addWishlistItem (AddWishlistItemRequest) returns (WishlistActionResponse);
  rpc removeWishlistItem (RemoveWishlistItemRequest) returns (WishlistActionResponse);
}

message WishlistItemGrpcDto {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  string product_slug = 4;
  string thumbnail = 5;
  double price = 6;

  google.protobuf.Timestamp created_at = 7;
}

message GetWishlistRequest {
  string user_id = 1;
}

message WishlistResponse {
  repeated WishlistItemGrpcDto data = 1;
}

message AddWishlistItemRequest {
  string user_id = 1;
  string product_id = 2;
  string product_name = 3;
  string product_slug = 4;
  string thumbnail = 5;
  double price = 6;
}

message RemoveWishlistItemRequest {
  string user_id = 1;
  string product_id = 2;
}

message WishlistActionResponse {
  string product_id = 1;
  bool added = 2;
}

message AddressGrpcDto {
  string id = 1;
  string user_id = 2;
  string full_name = 3;
  string phone = 4;
  string address1 = 5;
  optional string address2 = 6;
  string ward = 7;
  string district = 8;
  string city = 9;
  bool is_default = 10;

  google.protobuf.Timestamp created_at = 11;
}

message GetAddressesRequest {
  string user_id = 1;
}

message AddressesResponse {
  repeated AddressGrpcDto data = 1;
}

message AddressResponse {
  AddressGrpcDto data = 1;
}

message AddressIdResponse {
  string address_id = 1;
}

message CreateAddressRequest {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
  string address1 = 4;
  optional string address2 = 5;
  string ward = 6;
  string district = 7;
  string city = 8;
  bool is_default = 9;
}

message UpdateAddressRequest {
  string user_id = 1;
  string address_id = 2;
  string full_name = 3;
  string phone = 4;
  string address1 = 5;
  optional string address2 = 6;
  string ward = 7;
  string district = 8;
  string city = 9;
  bool is_default = 10;
}

message AddressActionRequest {
  string user_id = 1;
  string address_id = 2;
}

message GetUsersAdminRequest {
  optional string search = 1;  
  optional string order_by = 3;
  optional int32 page = 4;
  optional int32 limit = 5;
}

message UsersResponse {
  repeated UserGrpcDto data = 1;

  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

message UserGrpcDto {
  string id = 1;
  string full_name = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  double total_price = 6;
  bool is_verified = 7;
  bool is_active = 8;
  int32 total_order = 9;

  google.protobuf.Timestamp created_at = 10;
}

message GetUserAdminRequest {
  string user_id = 1;
}

message LastOrderItemGrpcDto {
  string product_id = 1;
  optional string variant_id = 2;
  string name = 3;
  optional string thumbnail = 4;
  int32 quantity = 5;
  double subtotal = 6;
}

message LastOrderGrpcDto {
  string order_id = 1;
  string order_number = 2;
  double total_price = 3;
  string order_status = 4;
  string payment_status = 5;

  google.protobuf.Timestamp ordered_at = 6;

  repeated LastOrderItemGrpcDto items = 7;
}

message UserAdminDetailGrpcDto {
  string id = 1;
  string full_name = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  optional string phone = 6;
  optional string avatar = 7;
  optional string gender = 8;
  google.protobuf.Timestamp date_of_birth = 9;
  bool is_verified = 10;
  bool is_active = 11;
  int32 total_orders = 12;
  double amount_spent = 13;
  google.protobuf.Timestamp customer_since = 14;
  optional LastOrderGrpcDto last_order = 15;

  google.protobuf.Timestamp created_at = 16;
}

message UserAuthResponse {
  string userId = 1;
  string role = 2;

  repeated string permissions = 3;

  string firstName = 4;
  string lastName = 5;

  string avatar = 6;
  string email = 7;
}

message UserAuthRequest {
  string userId = 1;
}

message CreateUserRequest {
  string email = 1;
  string firstName = 2;
  string lastName = 3;
  string roleName = 4;
}

message UserIdResponse {
  string userId = 1;
}