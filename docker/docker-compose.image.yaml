name: stationery-provider

networks:
  stationery-nw:
    driver: bridge
    name: stationery-nw

services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./docker_data/mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - stationery-nw

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stationery-app
    ports:
      - '5432:5432'
    volumes:
      - ./docker_data/postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    networks:
      - stationery-nw

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./docker_data/pgadmin_data:/var/lib/pgadmin
    networks:
      - stationery-nw

  kafka:
    container_name: kafka_server
    image: bitnamilegacy/kafka
    restart: unless-stopped
    networks:
      - stationery-nw
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ./docker_data/kafka_data/bitnami_data:/bitnami/kafka
    healthcheck:
      test:
        ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  bff:
    image: trantuananh17/stationery-provider-bff:latest
    container_name: bff_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/bff/.env
    ports:
      - '3400:3400'
    networks:
      - stationery-nw

  auth-service:
    image: trantuananh17/stationery-provider-auth-service:latest
    container_name: auth_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/auth-service/.env
    expose:
      - '5001'
    networks:
      - stationery-nw

  user-service:
    image: trantuananh17/stationery-provider-user-service:latest
    container_name: user_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/user-service/.env
    expose:
      - '5002'
    networks:
      - stationery-nw

  product-service:
    image: trantuananh17/stationery-provider-product-service:latest
    container_name: product_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/product-service/.env
    expose:
      - '5003'
    networks:
      - stationery-nw

  cart-service:
    image: trantuananh17/stationery-provider-cart-service:latest
    container_name: cart_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/cart-service/.env
    expose:
      - '5004'
    networks:
      - stationery-nw

  order-service:
    image: trantuananh17/stationery-provider-order-service:latest
    container_name: order_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/order-service/.env
    expose:
      - '5005'
    networks:
      - stationery-nw

  notification-service:
    image: trantuananh17/stationery-provider-notification-service:latest
    container_name: notification_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/notification-service/.env
    expose:
      - '5006'
    networks:
      - stationery-nw

  analytics-service:
    image: trantuananh17/stationery-provider-analytics-service:latest
    container_name: analytics_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/analytics-service/.env
    expose:
      - '5007'
    networks:
      - stationery-nw

  upload-service:
    image: trantuananh17/stationery-provider-upload-service:latest
    container_name: upload_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/upload-service/.env
    ports:
      - '3408:3408'
    expose:
      - '5008'
    networks:
      - stationery-nw

  payment-service:
    image: trantuananh17/stationery-provider-payment-service:latest
    container_name: payment_service
    restart: unless-stopped
    env_file:
      - ../.env
      - ../apps/payment-service/.env
    ports:
      - '3409:3409'
    expose:
      - '5009'
    networks:
      - stationery-nw