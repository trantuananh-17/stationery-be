# Stack triển khai trên VM. Khác hai file compose còn lại trong thư mục này:
#
#   docker-compose.provider.yaml  build từ source, dùng khi dev ở máy local
#   docker-compose.image.yaml     kéo ảnh Docker Hub, mỗi service một ảnh
#   docker-compose.deploy.yml     ← file này: một ảnh GHCR cho toàn bộ backend,
#                                   chọn service bằng APP_NAME
#
# Stack này tự đứng một mình: Postgres, Kafka và Qdrant đều dựng ngay tại đây,
# không mượn hạ tầng của stack khác nữa. Mongo vẫn không có mặt vì
# `MongoProvider` trong libs/configuration không được app nào import.
#
# Các service ứng dụng chỉ publish cổng loopback cho nginx (8090-8094). Riêng
# postgres publish thẳng 5432 ra ngoài theo yêu cầu: cần nối bằng GUI từ máy
# lập trình. Đổi lại thì mật khẩu trong env/postgres.env là thứ duy nhất chặn
# người lạ, đừng thay bằng chuỗi dễ đoán.
#
# Đặt tại /srv/stationery/docker-compose.yml trên VM. Biến IMAGE_TAG_* nằm
# trong /srv/stationery/.env và do workflow deploy ghi lại.

name: stationery

networks:
  stationery-nw:
    name: stationery-nw

volumes:
  kafka_data:
  postgres_data:
  qdrant_data:

x-backend: &backend
  image: ghcr.io/trantuananh-17/stationery-be:${IMAGE_TAG_BACKEND:-latest}
  restart: unless-stopped
  env_file:
    - ./env/root.env
  networks:
    - stationery-nw
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tạo sẵn 8 database của các service; TypeORM `synchronize` lo phần schema.
      # Lấy thẳng từ clone repo trên VM để script chỉ có một bản duy nhất.
      - ./stationery-be/docker/postgres/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Mo ra Internet de noi bang GUI tu ben ngoai. Day la cong duy nhat cua
    # datastore khong bo o loopback: ai quet duoc IP cung thu duoc mat khau.
    ports:
      - '5432:5432'
    networks:
      - stationery-nw

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - stationery-nw

  kafka:
    image: bitnamilegacy/kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - stationery-nw

  auth-service:
    <<: *backend
    environment:
      APP_NAME: auth-service
    env_file:
      - ./env/root.env
      - ./env/auth-service.env

  user-service:
    <<: *backend
    environment:
      APP_NAME: user-service
    env_file:
      - ./env/root.env
      - ./env/user-service.env

  product-service:
    <<: *backend
    environment:
      APP_NAME: product-service
    env_file:
      - ./env/root.env
      - ./env/product-service.env

  cart-service:
    <<: *backend
    environment:
      APP_NAME: cart-service
    env_file:
      - ./env/root.env
      - ./env/cart-service.env

  order-service:
    <<: *backend
    environment:
      APP_NAME: order-service
    env_file:
      - ./env/root.env
      - ./env/order-service.env

  payment-service:
    <<: *backend
    environment:
      APP_NAME: payment-service
    env_file:
      - ./env/root.env
      - ./env/payment-service.env

  notification-service:
    <<: *backend
    environment:
      APP_NAME: notification-service
    env_file:
      - ./env/root.env
      - ./env/notification-service.env
    # WebSocket: FE nối thẳng vào gateway của service này qua nginx.
    ports:
      - '127.0.0.1:8092:3406'

  analytics-service:
    <<: *backend
    environment:
      APP_NAME: analytics-service
    env_file:
      - ./env/root.env
      - ./env/analytics-service.env

  upload-service:
    <<: *backend
    environment:
      APP_NAME: upload-service
    env_file:
      - ./env/root.env
      - ./env/upload-service.env
    # FE gọi thẳng service này, không qua BFF (xem known-issues.md mục B).
    ports:
      - '127.0.0.1:8093:3408'

  bff:
    <<: *backend
    environment:
      APP_NAME: bff
    env_file:
      - ./env/root.env
      - ./env/bff.env
    ports:
      - '127.0.0.1:8090:3400'

  # Không dùng anchor *backend: ai-service không đụng Postgres, và nó phải chờ
  # qdrant thay vì kafka.
  ai-service:
    image: ghcr.io/trantuananh-17/stationery-be:${IMAGE_TAG_BACKEND:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: ai-service
    env_file:
      - ./env/root.env
      - ./env/ai-service.env
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - stationery-nw
    # Chatbot phia FE goi thang ai-service, khong qua BFF (xem api-contract.md).
    ports:
      - '127.0.0.1:8094:3413'

  fe:
    image: ghcr.io/trantuananh-17/stationery-fe:${IMAGE_TAG_FRONTEND:-latest}
    restart: unless-stopped
    env_file:
      - ./env/fe.env
    ports:
      - '127.0.0.1:8091:3000'
    networks:
      - stationery-nw
